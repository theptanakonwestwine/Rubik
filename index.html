                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="hint">แตะปุ่มเพื่อหมุนแต่ละหน้า · ตัวอักษรมี ' คือหมุนย้อนกลับ</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        (function(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "use strict";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                /* ============ geometry / data model ============
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     CSS-native coordinate space: +x = right, +y = down, +z = toward viewer.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Face labels: R=+x, L=-x, D=+y(down), U=-y(up), F=+z, B=-z.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               All rotation math below uses the exact CSS rotateX/Y/Z matrices so that
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    the animated visual rotation and the logical data rotation always match. */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const SIZE = 56;      // cubie size (px)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const GAP = 3;         // gap between cubies
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const SP = SIZE + GAP; // spacing between cubie centers

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const DIRS = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    R:[1,0,0], L:[-1,0,0],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        D:[0,1,0], U:[0,-1,0],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            F:[0,0,1], B:[0,0,-1]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const BASE_COLOR = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    U:'var(--c-U)', D:'var(--c-D)', L:'var(--c-L)', R:'var(--c-R)', F:'var(--c-F)', B:'var(--c-B)'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const FACE_KEYS = ['U','D','L','R','F','B'];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function rotatePos(p, axis, theta){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const rad = theta * Math.PI / 180;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const c = Math.round(Math.cos(rad));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const s = Math.round(Math.sin(rad));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let {x,y,z} = p;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(axis === 'x') return {x, y: y*c - z*s, z: y*s + z*c};
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(axis === 'y') return {x: x*c + z*s, y, z: -x*s + z*c};
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return {x: x*c - y*s, y: x*s + y*c, z};
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function vecToKey(v){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            for(const k of FACE_KEYS){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const d = DIRS[k];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(d[0]===v.x && d[1]===v.y && d[2]===v.z) return k;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function rotateColors(colors, axis, theta){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const out = {};
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    for(const key in colors){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const d = DIRS[key];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const nv = rotatePos({x:d[0],y:d[1],z:d[2]}, axis, theta);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const nk = vecToKey(nv);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                out[nk] = colors[key];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return out;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // theta sign per base move (prime = opposite sign). Arbitrary but self-consistent.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const MOVES = {
