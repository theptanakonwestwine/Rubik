<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>CUBE.LAB — รูบิคออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
      --bg-0:#14161b;
          --bg-1:#1b1e26;
              --panel:rgba(255,255,255,0.035);
                  --panel-border:rgba(255,255,255,0.08);
                      --text-0:#f2efe9;
                          --text-1:#9298a3;
                              --accent:#e8a33d;
                                  --accent-dim:#8a6a33;
                                      --steel:#4d6b93;
                                          --danger:#e0313b;
                                              --good:#2fae66;

                                                  --c-U:#f4f1ea;
                                                      --c-D:#f5c518;
                                                          --c-L:#ff7a29;
                                                              --c-R:#e0313b;
                                                                  --c-F:#2fae66;
                                                                      --c-B:#2f6fed;
                                                                          --c-hidden:#101216;
                                                                            }

                                                                              *{box-sizing:border-box;}
                                                                                html,body{
                                                                                    margin:0; padding:0; height:100%;
                                                                                        background: radial-gradient(120% 140% at 50% -10%, var(--bg-1) 0%, var(--bg-0) 60%);
                                                                                            color:var(--text-0);
                                                                                                font-family:'Space Grotesk', system-ui, sans-serif;
                                                                                                    overflow:hidden;
                                                                                                        -webkit-tap-highlight-color: transparent;
                                                                                                          }

                                                                                                            .app{
                                                                                                                position:relative;
                                                                                                                    width:100vw; height:100vh;
                                                                                                                        display:flex; flex-direction:column;
                                                                                                                          }

                                                                                                                            /* ---------- header ---------- */
                                                                                                                              .topbar{
                                                                                                                                  display:flex; align-items:flex-start; justify-content:space-between;
                                                                                                                                      padding: 18px 22px 0;
                                                                                                                                          z-index:5;
                                                                                                                                              pointer-events:none;
                                                                                                                                                }
                                                                                                                                                  .wordmark{
                                                                                                                                                      font-weight:700; font-size:15px; letter-spacing:0.14em;
                                                                                                                                                          color:var(--text-0); opacity:0.9;
                                                                                                                                                            }
                                                                                                                                                              .wordmark span{ color:var(--accent); }
                                                                                                                                                                .sub{
                                                                                                                                                                    font-size:11px; color:var(--text-1); letter-spacing:0.06em; margin-top:3px;
                                                                                                                                                                      }
                                                                                                                                                                        .readout{
                                                                                                                                                                            text-align:right;
                                                                                                                                                                                font-family:'JetBrains Mono', monospace;
                                                                                                                                                                                  }
                                                                                                                                                                                    .readout .time{
                                                                                                                                                                                        font-size:22px; font-weight:700; color:var(--text-0);
                                                                                                                                                                                            letter-spacing:0.02em;
                                                                                                                                                                                                transition: color 300ms ease, text-shadow 300ms ease;
                                                                                                                                                                                                  }
                                                                                                                                                                                                    .readout .moves{
                                                                                                                                                                                                        font-size:11px; color:var(--text-1); margin-top:2px; letter-spacing:0.08em;
                                                                                                                                                                                                          }
                                                                                                                                                                                                            .readout.solved .time{
                                                                                                                                                                                                                color:var(--good);
                                                                                                                                                                                                                    text-shadow: 0 0 18px rgba(47,174,102,0.55);
                                                                                                                                                                                                                      }
                                                                                                                                                                                                                       /* ---------- scene ---------- */
                                                                                                                                                                                                                         .scene{
                                                                                                                                                                                                                             flex:1;
                                                                                                                                                                                                                                 position:relative;
                                                                                                                                                                                                                                     perspective: 1100px;
                                                                                                                                                                                                                                         display:flex; align-items:center; justify-content:center;
                                                                                                                                                                                                                                             cursor: grab;
                                                                                                                                                                                                                                                 touch-action: none;
                                                                                                                                                                                                                                                   }
                                                                                                                                                                                                                                                     .scene:active{ cursor: grabbing; }

                                                                                                                                                                                                                                                       .glow{
                                                                                                                                                                                                                                                           position:absolute; width:340px; height:120px; left:50%; top:58%;
                                                                                                                                                                                                                                                               transform: translate(-50%,-50%);
                                                                                                                                                                                                                                                                   background: radial-gradient(closest-side, rgba(232,163,61,0.16), transparent 70%);
                                                                                                                                                                                                                                                                       filter: blur(6px);
                                                                                                                                                                                                                                                                           pointer-events:none;
                                                                                                                                                                                                                                                                               transition: background 400ms ease;
                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                   .glow.solved{
                                                                                                                                                                                                                                                                                       background: radial-gradient(closest-side, rgba(47,174,102,0.25), transparent 70%);
                                                                                                                                                                                                                                                                                         }

                                                                                                                                                                                                                                                                                           .view{
                                                                                                                                                                                                                                                                                               transform-style: preserve-3d;
                                                                                                                                                                                                                                                                                                   transform: rotateX(-26deg) rotateY(-34deg);
                                                                                                                                                                                                                                                                                                       width: 10px; height:10px;
                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                           .cube{
                                                                                                                                                                                                                                                                                                               transform-style: preserve-3d;
                                                                                                                                                                                                                                                                                                                   position:relative;
                                                                                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                                                                                       .cubie{
                                                                                                                                                                                                                                                                                                                           position:absolute;
                                                                                                                                                                                                                                                                                                                               top:0; left:0;
                                                                                                                                                                                                                                                                                                                                   width:56px; height:56px;
                                                                                                                                                                                                                                                                                                                                       transform-style: preserve-3d;
                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                           .face{
                                                                                                                                                                                                                                                                                                                                               position:absolute;
                                                                                                                                                                                                                                                                                                                                                   top:0; left:0;
                                                                                                                                                                                                                                                                                                                                                       width:56px; height:56px;
                                                                                                                                                                                                                                                                                                                                                           border-radius:7px;
                                                                                                                                                                                                                                                                                                                                                               box-shadow: inset 0 0 0 3px rgba(0,0,0,0.35), inset 0 2px 6px rgba(255,255,255,0.18);
                                                                                                                                                                                                                                                                                                                                                                   backface-visibility: hidden;
                                                                                                                                                                                                                                                                                                                                                                     }

                                                                                                                                                                                                                                                                                                                                                                       .solvedFlash{
                                                                                                                                                                                                                                                                                                                                                                           position:absolute; left:50%; top:14%; transform:translate(-50%,-50%) scale(0.85);
                                                                                                                                                                                                                                                                                                                                                                               font-family:'JetBrains Mono', monospace;
                                                                                                                                                                                                                                                                                                                                                                                   font-weight:700; letter-spacing:0.16em; font-size:13px;
                                                                                                                                                                                                                                                                                                                                                                                       color:var(--good);
                                                                                                                                                                                                                                                                                                                                                                                           background: rgba(47,174,102,0.1);
                                                                                                                                                                                                                                                                                                                                                                                               border:1px solid rgba(47,174,102,0.4);
                                                                                                                                                                                                                                                                                                                                                                                                   padding:6px 14px; border-radius:20px;
                                                                                                                                                                                                                                                                                                                                                                                                       opacity:0; pointer-events:none;
                                                                                                                                                                                                                                                                                                                                                                                                           transition: opacity 300ms ease, transform 300ms ease;
                                                                                                                                                                                                                                                                                                                                                                                                               z-index:6;
                                                                                                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                                                                                                   .solvedFlash.show{
                                                                                                                                                                                                                                                                                                                                                                                                                       opacity:1; transform:translate(-50%,-50%) scale(1);
                                                                                                                                                                                                                                                                                                                                                                                                                         }

                                                                                                                                                                                                                                                                                                                                                                                                                           /* ---------- dock ---------- */
                                                                                                                                                                                                                                                                                                                                                                                                                             .dock{
                                                                                                                                                                                                                                                                                                                                                                                                                                 z-index:5;
                                                                                                                                                                                                                                                                                                                                                                                                                                     padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
                                                                                                                                                                                                                                                                                                                                                                                                                                         display:flex; flex-direction:column; gap:10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                             align-items:center;
                                                                                                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                                                                                                                 .movepad{
                                                                                                                                                                                                                                                                                                                                                                                                                                                     display:grid;
                                                                                                                                                                                                                                                                                                                                                                                                                                                         grid-template-columns: repeat(6, 1fr);
                                                                                                                                                                                                                                                                                                                                                                                                                                                             gap:6px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                 background: var(--panel);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                     border:1px solid var(--panel-border);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                         backdrop-filter: blur(14px);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                             border-radius:14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 padding:8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     max-width: 560px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         width:100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             .movepad button{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 font-family:'JetBrains Mono', monospace;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     font-size:13px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         font-weight:700;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             color:var(--text-0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 background: rgba(255,255,255,0.04);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     border:1px solid rgba(255,255,255,0.07);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         border-radius:8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             padding:10px 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 cursor:pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     transition: background 120ms ease, transform 80ms ease, border-color 120ms ease;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         .movepad button:hover{ background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.16); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           .movepad button:active{ transform: scale(0.92); background: var(--accent-dim); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             .movepad button:disabled{ opacity:0.35; cursor:default; }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               .actions{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       .actions button{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           font-family:'Space Grotesk', sans-serif;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               font-size:13px; font-weight:600; letter-spacing:0.02em;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   padding:10px 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       border-radius:10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           cursor:pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               border:1px solid transparent;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   transition: filter 120ms ease, transform 80ms ease;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       .actions button:active{ transform: scale(0.96); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         .btn-scramble{ background: var(--accent); color:#241a08; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           .btn-scramble:hover{ filter:brightness(1.08); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             .btn-reset{ background: transparent; color:var(--text-1); border-color: var(--panel-border); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               .btn-reset:hover{ color:var(--text-0); border-color: rgba(255,255,255,0.25); }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 .hint{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     font-size:11px; color: var(--text-1); text-align:center; letter-spacing:0.02em;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         max-width:420px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             @media (max-width: 480px){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 .movepad{ grid-template-columns: repeat(4, 1fr); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     .wordmark{ font-size:13px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         .readout .time{ font-size:18px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="app">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="topbar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="wordmark">CUBE<span>.</span>LAB</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="sub">รูบิคออนไลน์ · ลากเพื่อหมุนมุมมอง</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="readout" id="readout">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="time" id="timeDisplay">00:00.0</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="moves" id="moveCount">0 ท่า</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="scene" id="scene">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="glow" id="glow"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="solvedFlash" id="solvedFlash">SOLVED ✓</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="view" id="view">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="cube" id="cube"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="dock">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="movepad" id="movepad"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button class="btn-scramble" id="btnScramble">สุ่มลูกเต๋า (Scramble)</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="btn-reset" id="btnReset">รีเซ็ต</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
